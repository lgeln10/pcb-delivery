<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AIOS License 管理台</title>
<style>
  :root { --pri:#2f6bff; --bg:#f6f7f9; --card:#fff; --border:#e5e7eb; --txt:#1f2430; --sub:#6b7280; --ok:#2f9e51; --warn:#c8871a; --err:#d9534f; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }  /* 让 hidden 属性覆盖下面 #login 的 display:flex，否则登录后藏不住登录框 */
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; background:var(--bg); color:var(--txt); }
  header { background:var(--card); border-bottom:1px solid var(--border); padding:14px 24px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header .grow { flex:1; }
  main { max-width:1100px; margin:24px auto; padding:0 24px; display:flex; flex-direction:column; gap:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
  .card h2 { font-size:15px; margin:0 0 14px; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  label { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--sub); }
  input { border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:14px; min-width:130px; }
  input:focus { outline:none; border-color:var(--pri); }
  button { border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; background:var(--pri); color:#fff; }
  button.ghost { background:#eef1f6; color:var(--txt); }
  button.danger { background:#fdeaea; color:var(--err); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--sub); font-weight:600; }
  td.actions { display:flex; gap:6px; }
  .pill { padding:1px 9px; border-radius:99px; font-size:12px; font-weight:600; }
  .pill.ok { background:#e6f5ea; color:var(--ok); }
  .pill.rev { background:#fdeaea; color:var(--err); }
  .pill.exp { background:#fdf1dc; color:var(--warn); }
  .muted { color:var(--sub); }
  .err { color:var(--err); font-size:13px; min-height:18px; margin:4px 0 0; }
  /* 登录页 */
  #login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#eef2ff,#f6f7f9); }
  .login-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; width:340px; box-shadow:0 10px 40px rgba(20,30,60,.08); display:flex; flex-direction:column; gap:12px; }
  .login-card h1 { font-size:20px; margin:0; text-align:center; }
  .login-card p.sub { margin:0 0 6px; text-align:center; color:var(--sub); font-size:13px; }
  .login-card input { width:100%; }
  .login-card button { width:100%; padding:11px; font-size:14px; margin-top:4px; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1f2430; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; transition:.2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login" hidden>
  <div class="login-card">
    <h1>🔑 License 管理台</h1>
    <p class="sub">请登录以管理授权</p>
    <input id="lu" placeholder="用户名" autocomplete="username" />
    <input id="lp" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()" />
    <button onclick="login()">登录</button>
    <p id="lerr" class="err"></p>
  </div>
</div>

<!-- 主界面 -->
<div id="app" hidden>
  <header>
    <h1>🔑 AIOS License 管理台</h1>
    <span class="grow"></span>
    <span id="who" class="muted"></span>
    <button class="ghost" onclick="logout()">退出登录</button>
  </header>
  <main>
    <div class="card">
      <h2>签发新授权</h2>
      <div class="row">
        <label>客户名称<input id="customer" placeholder="如：客户A" /></label>
        <label>席位数<input id="seats" type="number" value="50" style="min-width:90px" /></label>
        <label>有效天数<input id="days" type="number" value="365" style="min-width:90px" /></label>
        <label>宽限天数<input id="grace" type="number" value="7" style="min-width:90px" /></label>
        <label style="flex-direction:row;align-items:center;gap:6px;padding-bottom:9px"><input id="ai" type="checkbox" checked style="min-width:auto;width:16px;height:16px" />智能体工作台(AI 板块)</label>
        <button onclick="issue()">签发</button>
      </div>
      <div id="issued" style="margin-top:14px"></div>
    </div>
    <div class="card">
      <h2>授权列表 <button class="ghost" style="font-weight:500;padding:5px 12px;margin-left:8px" onclick="refresh()">刷新</button></h2>
      <div id="list"><p class="muted">加载中…</p></div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let lastLic = null;
function downloadLic(){
  if(!lastLic) return;
  const blob = new Blob([JSON.stringify({ license:lastLic.license, server:lastLic.server }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (lastLic.customer||'license').replace(/[^\w一-龥.-]/g,'_') + '.lic';
  a.click(); URL.revokeObjectURL(a.href);
}
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function showLogin(){ $('login').hidden=false; $('app').hidden=true; setTimeout(()=>$('lu').focus(),50); }
function showApp(user){ $('login').hidden=true; $('app').hidden=false; $('who').textContent=user?('已登录：'+user):''; }

async function api(path, opts={}){
  const r = await fetch(path, { ...opts, headers:{ 'content-type':'application/json', ...(opts.headers||{}) } });
  if(r.status===401){ showLogin(); throw new Error('登录已失效，请重新登录'); }
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}
async function login(){
  $('lerr').textContent='';
  try{
    const r = await fetch('/login',{ method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ username:$('lu').value.trim(), password:$('lp').value }) });
    if(!r.ok){ const d=await r.json().catch(()=>({})); $('lerr').textContent=d.error||'登录失败'; return; }
    $('lp').value=''; check();
  }catch(e){ $('lerr').textContent='网络错误'; }
}
async function logout(){ try{ await fetch('/logout',{method:'POST'}); }catch{} showLogin(); }
async function check(){
  try{ const d=await (await fetch('/me')).json(); if(d.authed){ showApp(d.user); refresh(); } else showLogin(); }
  catch{ showLogin(); }
}

function fmt(iso){ return iso ? new Date(iso).toLocaleString('zh-CN',{hour12:false}) : '—'; }
function stateOf(x){
  if(x.revoked) return '<span class="pill rev">已吊销</span>';
  if(new Date(x.expiresAt) < new Date()) return '<span class="pill exp">已过期</span>';
  return '<span class="pill ok">有效</span>';
}
async function issue(){
  const body = { customer:$('customer').value.trim(), seats:+$('seats').value, days:+$('days').value, graceDays:+$('grace').value, features: $('ai').checked ? ['ai'] : [] };
  if(!body.customer){ toast('请填客户名称'); return; }
  try{
    const d = await api('/issue',{ method:'POST', body:JSON.stringify(body) });
    lastLic = { customer:d.customer, license:d.license, server:location.origin };
    $('issued').innerHTML = '<div class="card" style="background:#f0f7ff"><b>已签发给「'+esc(d.customer)+'」</b>（'+d.seats+' 席位 · 到期 '+d.expiresAt.slice(0,10)+'）<br>'
      + '<button style="margin-top:10px" onclick="downloadLic()">⬇ 下载授权文件（.lic）</button> <span class="muted">发给客户，在系统里上传即可激活</span>'
      + '<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">或手动填 .env（点开）</summary><textarea readonly style="width:100%;height:70px;margin-top:6px;font-size:12px" onclick="this.select()">'+d.license+'</textarea></details></div>';
    $('customer').value=''; refresh();
  }catch(e){ toast('签发失败：'+e.message); }
}
async function revoke(id){ if(!confirm('确定吊销？客户次日心跳后转只读。')) return; try{ await api('/revoke',{method:'POST',body:JSON.stringify({licenseId:id})}); toast('已吊销'); refresh(); }catch(e){ toast(e.message); } }
async function renew(id){ const days=prompt('续期多少天？',365); if(!days) return; try{ const d=await api('/renew',{method:'POST',body:JSON.stringify({licenseId:id,days:+days})}); toast('已续期至 '+d.expiresAt.slice(0,10)); refresh(); }catch(e){ toast(e.message); } }
async function refresh(){
  try{
    const d = await api('/admin/licenses');
    const items = (d.items||[]).sort((a,b)=> (a.customer||'').localeCompare(b.customer||''));
    if(!items.length){ $('list').innerHTML='<p class="muted">还没有签发任何授权。</p>'; return; }
    $('list').innerHTML = '<table><thead><tr><th>客户</th><th>状态</th><th>席位</th><th>到期</th><th>最近心跳</th><th>操作</th></tr></thead><tbody>'
      + items.map(x=>'<tr><td><b>'+esc(x.customer||'')+'</b><br><span class="muted" style="font-size:11px">'+x.licenseId.slice(0,8)+'</span></td>'
      + '<td>'+stateOf(x)+ ((x.features||[]).includes('ai')?' <span class="pill ok" style="background:#eef">AI</span>':'') +'</td><td>'+x.seats+'</td><td>'+ (x.expiresAt||'').slice(0,10) +'</td><td class="muted">'+fmt(x.lastHeartbeatAt)+'</td>'
      + '<td class="actions"><button class="ghost" onclick="renew(\''+x.licenseId+'\')">续期</button>'
      + (x.revoked?'':'<button class="danger" onclick="revoke(\''+x.licenseId+'\')">吊销</button>')+'</td></tr>').join('')
      + '</tbody></table>';
  }catch(e){ if(e.message.indexOf('登录')<0) $('list').innerHTML='<p class="muted">加载失败：'+e.message+'</p>'; }
}
check();
</script>
</body>
</html>
