  TerminalPad:          {genesis: unverified, native: verified}
  VcutClearance:        {genesis: unverified, native: verified}
  VcutCoupon:           {genesis: unverified, native: verified}   # 2026-09-20 M6o 两块真板终稿量出来：防 V-cut 测试点（两个 ⌀1.05 盘 + 0.35 Λ 线顶到 V-cut 线，⌀1.3 窗）   # 四层拼板真板看图反推：V-cut 线两侧铜皮退 0.4（set/ 0.36–0.40，客户原稿 0.13）   # 第一块真板看图反推：≥4 mm 锣槽/方孔端子焊盘各层加大；订单 outer_pad_mm 的孔外层焊盘
