- id: mi.flow.second_drill.positive
  board_type: "正片（双面板为例）"
  category: "4、干膜关于二钻流程"
  source_page: 212
  steps: ["开料", "钻孔", "沉铜/板电", "图形转移", "图形电镀", "二钻/锣半孔", "蚀刻/退锡", "阻焊", "字符", "表面处理", "成型", "测试", "终检", "包装", "入库出货"]
  quote: "开料→钻孔→沉铜/板电→图形转移→图形电镀→二钻/锣半孔"
  note: "正片二钻或者锣半孔的流程在蚀刻前，二钻与锣半孔拉起来的铜皮毛刺，后面才能把它蚀刻掉"

- id: mi.flow.second_drill.negative
  board_type: "负片（双面板为例）"
  category: "4、干膜关于二钻流程"
  source_page: 212
  steps: ["开料", "钻孔", "沉铜", "整板电镀", "图形转移", "蚀刻", "阻焊", "字符", "二钻", "表面处理", "成型", "测试", "终检", "包装", "入库出货"]
  quote: "开料→钻孔→沉铜→整板电镀→图形转移→蚀刻→阻焊→字符"
  note: "负片的二钻不能放在蚀刻前，因负片不用镀锡，线路没有锡保护会刮伤线路，所以负片的二钻在表面处理前钻孔。"

