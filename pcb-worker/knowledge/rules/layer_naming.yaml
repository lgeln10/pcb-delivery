- id: layer.prep.align_to_drill
  rule: "资料对齐以钻孔层为基准"
  source_page: 111
  quote: "资料对齐，以钻孔层为基准，对齐，定义层属性及板属性"

- id: layer.prep.profile_line_width
  rule: "把外形线变成0.15MM，定义 Profile"
  value: 0.15
  unit: mm
  source_page: 111
  quote: "把外形线变成0.15MM,定义 “Profile”"

- id: layer.prep.backup_plus1
  rule: "把所有板属性的层复制一个 +1 放在下面，方便做完之后对原稿用"
  source_page: 111
  quote: "把所有板属性的复制一个 “+1”放在下面，如图：方便做完之后对原稿用"

- id: layer.prep.net_step
  rule: "复制step net，在 net 删掉 Profile 以外的东西，钻孔定义好孔属性，做完资料后做网络比较"
  source_page: 111
  quote: "复制step “net”在 “net”删掉“Profile”以外的东西，钻孔定义好孔属性，方便做完资料后做网络比较，检查资料是否因为误操作导致开短路"

- id: layer.prep.edit_step
  rule: "用 Orig 复制 step 改成 Edit，删掉板外物"
  source_page: 112
  quote: "用“Orig”复制step 改成 “Edit” 删掉板外物"
