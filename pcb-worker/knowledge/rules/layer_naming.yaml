# 来源：《CAM工程技能培训》第4章 p110–110；quote 为原文逐字片段
# 注意：p110 层命名表在 pdftotext 导出中仅剩 "board / positive / signal" 三个词，
# 各行 quote 为本页渲染图中表格行的逐字转录（quote_source: page_render），无法在 pages/110.txt 中逐字检索。

- id: layer.name.factory_specific
  rule: "文件/层命名根据每个工厂有所不同，按实际工厂要求命名"
  source_page: 110
  quote: "一般命名规则：根据每个工厂有所不同，按实际工厂要求命名"
  factory_specific: true

- id: layer.name.top_silk
  rule: "顶层字符 命名为 GTO"
  applies_to: silk_screen
  source_page: 110
  quote: "顶层字符 GTO board silk_screen positive"
  quote_source: page_render
  note: "表格列：board / silk_screen / positive"

- id: layer.name.top_solder_mask
  rule: "顶层阻焊 命名为 GTS"
  applies_to: solder_mask
  source_page: 110
  quote: "顶层阻焊 GTS board solder_mask positive"
  quote_source: page_render

- id: layer.name.top_signal
  rule: "顶层线路 命名为 GTL"
  applies_to: signal
  source_page: 110
  quote: "顶层线路 GTL board signal positive"
  quote_source: page_render

- id: layer.name.l2
  rule: "第二层 命名为 L2"
