# 来源：《CAM工程技能培训》第15章 p185–201；quote 为原文逐字片段

# ---------- 阻抗类型 ----------
- id: impedance.type.single_ended
  rule: "单端(线)阻抗：指单根信号线测得的阻抗"
  source_page: 185
  quote: "单端(线)阻抗：英文 single ended impedance ,指单根信号线测得的阻抗"

- id: impedance.type.differential
  rule: "差分(动)阻抗：指差分驱动时在两条等宽等间距的传输线中测试到的阻抗"
  source_page: 185
  quote: "差分(动)阻抗：英文 differential impedance,指差分驱动时在两条等宽等间距的传 输线中测试到的阻抗"

- id: impedance.type.coplanar
  rule: "共面阻抗：信号线在其周围 GND/VCC(信号线到其两侧 GND/VCC间距相等)之间传输时所测试到的"
  source_page: 185
  quote: "共面阻抗：英文 coplanar impedance ,指信号线在其周围 GND/VCC(信号线到其两侧 GND/VCC间距相等)之间传输时所测试到的"

# ---------- 影响因素（正比/反比） ----------
- id: impedance.factor.er_inverse
  rule: "介质介电常数，与阻抗值成反比"
  source_page: 185
  quote: "介质介电常数，与阻抗值成反比"

- id: impedance.factor.h_direct
  rule: "H1，H2，H3...：线路层与接地层间介质厚度,与阻抗值成正比"
  source_page: 185
  quote: "H1，H2，H3...：线路层与接地层间介质厚度,与阻抗值成正比"

- id: impedance.factor.w_inverse
  rule: "阻抗线线底宽度 W1 / 线面宽度 W2，与阻抗成反比"
  source_page: 185
  quote: "阻抗线线底宽度：W1 为原稿阻抗线宽，W2：阻抗线线面宽度,与阻抗成反比"

- id: impedance.factor.t_inverse
  rule: "铜厚与阻抗值成反比"
  source_page: 186
  quote: "铜厚与阻抗值成反比"

- id: impedance.factor.spacing_direct
  rule: "相邻线路与线路之间的间距,与阻抗值成正比（差动阻抗）"
  source_page: 186
  quote: "相邻线路与线路之间的间距,与阻抗值成正比（差动阻抗）"

- id: impedance.factor.soldermask_inverse
  rule: "基材阻焊厚度 / C2 线面阻焊厚度 / C3 线间阻焊厚度 / CEr 阻焊介电常数，均与阻抗值成反比"
  source_page: 186
  quote: "基材阻焊厚度,与阻抗值成反比 ；C2：线面阻焊厚度,与阻抗值成反比 ；C3：线间阻焊厚度, 与阻抗值成反比 ；CEr：阻焊介电常数，与阻抗值成反比"

# ---------- 线宽补偿：W1 = W2 + Δ ----------
- id: impedance.w1_w2.inner_hoz
  rule: "内层底铜为 HOZ 时，W1=W2+0.3mil"
  value: 0.3
  unit: mil
  applies_to: inner_layer_HOZ
  source_page: 185
  quote: "当内层底铜为 HOZ 时，W1=W2+0.3mil"

- id: impedance.w1_w2.inner_1oz
  rule: "内层底铜为 1OZ 时,W1=W2+0.5mil"
  value: 0.5
  unit: mil
  applies_to: inner_layer_1OZ
  source_page: 185
  quote: "内层底铜为 1OZ 时，W1=W2+0.5mil"

- id: impedance.w1_w2.inner_2oz
  rule: "内层底铜为 2OZ 时 W1=W2+1.2mil"
  value: 1.2
  unit: mil
  applies_to: inner_layer_2OZ
  source_page: 185
  quote: "当内层底铜为 2OZ 时 W1=W2+1.2mil"

- id: impedance.w1_w2.outer_hoz
  rule: "外层底铜为 HOZ,W1=W2+0.8mil"
  value: 0.8
  unit: mil
  applies_to: outer_layer_HOZ
  source_page: 185
  quote: "当外层底铜为 HOZ,W1=W2+0.8mil"

- id: impedance.w1_w2.outer_1oz
  rule: "外层底铜为 1OZ 时,W1=W2+1.2mil"
  value: 1.2
  unit: mil
  applies_to: outer_layer_1OZ
  source_page: 185
  quote: "外层底铜为 1OZ 时,W1=W2+1.2mil"

- id: impedance.w1_w2.outer_2oz
  rule: "外层层底铜为 2OZ 时,W1=W2+1.6mil"
  value: 1.6
  unit: mil
  applies_to: outer_layer_2OZ
  source_page: 185
  quote: "外层层底铜为 2OZ 时,W1=W2+1.6mil"

# ---------- 铜厚 T1 计算值 ----------
- id: impedance.t1.inner_hoz
  rule: "內层为基板铜厚,HOZ 按 15UM 计算"
  value: 15
  unit: um
  applies_to: inner_layer_HOZ
  source_page: 186
  quote: "內层为基板铜厚,HOZ 按 15UM 计算"

- id: impedance.t1.inner_1oz
  rule: "内层 1OZ 按 30UM 计算"
  value: 30
  unit: um
  applies_to: inner_layer_1OZ
  source_page: 186
  quote: "1OZ 按 30UM 计算"

- id: impedance.t1.inner_2oz
  rule: "内层 2OZ 按 65UM 计算"
  value: 65
  unit: um
  applies_to: inner_layer_2OZ
  source_page: 186
  quote: "2OZ 按 65UM 计算"

- id: impedance.t1.outer_definition
  rule: "外层为铜箔厚度+镀铜厚度,依据孔铜規格而定"
  applies_to: outer_layer
  source_page: 186
  quote: "外层为铜箔厚度+镀铜厚度,依据孔铜規格而定"

- id: impedance.t1.outer_hoz.hole20
  rule: "底铜为HOZ,孔铜(平均 20UM，最小 18UM )时,表铜按 45UM 计算"
  value: 45
  unit: um
  applies_to: outer_layer_HOZ
  source_page: 186
  quote: "当底铜为HOZ,孔铜(平均 20UM，最小 18UM )时,表铜按 45UM 计算"

- id: impedance.t1.outer_hoz.hole25
  rule: "底铜为HOZ,孔铜（平均 25UM，最小 20UM）时，表铜按 50UM 计算"
  value: 50
  unit: um
  applies_to: outer_layer_HOZ
  source_page: 186
  quote: "孔铜（平均 25UM，最小 20UM）时，表铜按 50UM 计算"

- id: impedance.t1.outer_hoz.hole_min25
  rule: "底铜为HOZ,孔铜单点最小 25UM 时，表铜按 55UM 计算"
  value: 55
  unit: um
  applies_to: outer_layer_HOZ
  source_page: 186
  quote: "孔铜单点最小 25UM 时，表铜按 55UM 计算"

- id: impedance.t1.outer_1oz.hole20
  rule: "底铜为 1OZ,孔銅(平均 20UM，最小 18UM )时,表铜按 55UM 计算"
  value: 55
  unit: um
  applies_to: outer_layer_1OZ
  source_page: 186
  quote: "当底铜为 1OZ,孔銅(平均 20UM，最小 18UM )时,表铜按 55UM 计算"

- id: impedance.t1.outer_1oz.hole25
  rule: "底铜为 1OZ,孔铜（平均 25UM，最小 20UM）时，表铜按 60UM 计算"
  value: 60
  unit: um
  applies_to: outer_layer_1OZ
  source_page: 186
  quote: "孔铜（平均 25UM，最小 20UM）时，表铜按 60UM 计算"

- id: impedance.t1.outer_1oz.hole_min25
  rule: "底铜为 1OZ,孔铜单点最小 25UM 时，表铜按 65UM 计算"
  value: 65
  unit: um
  applies_to: outer_layer_1OZ
  source_page: 186
  quote: "孔铜单点最小 25UM 时，表铜按 65UM 计算"

# ---------- 阻焊厚度 C1/C2/C3、CEr ----------
