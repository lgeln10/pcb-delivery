# 来源：《CAM工程技能培训》第5章 p113–118；quote 为原文逐字片段

# ---- 一、核对资料 (p113) ----
- id: drill.verify.size_and_count
  rule: "根据客户提供信息或分孔图核对孔径大小及孔数，有疑问需要提出来"
  source_page: 113
  quote: "根据客户提供信息或分孔图核对孔径大小及孔数看是否一致，有疑问需要提出来"

- id: drill.verify.copy_missing_from_drill_map
  rule: "把分孔图上有孔钻孔没有的复制到钻孔层"
  source_page: 113
  quote: "把分孔图上有孔钻孔没有的复制到钻孔层"

- id: drill.verify.copy_rout_holes
  rule: "将外形上能用钻孔钻出来的复制到钻孔层钻出来"
  source_page: 113
  quote: "将外形上能用钻孔钻出来的复制到钻孔层钻出来"

- id: drill.verify.slots_not_missed
  rule: "分孔图及外形层上的槽孔不能漏，一定要核对准确"
  source_page: 113
  quote: "需要特别注意的是分孔图及外形层上的槽孔不能漏，一定要核对准确。"

# ---- 二、孔属性 (p114) ----
- id: drill.attribute.plated
  rule: "Plated 金属孔，不需要定义，默认的"
  applies_to: plated
  source_page: 114
  quote: "1.Plated(金属孔，不需要定义默认的）"

- id: drill.attribute.non_plated
  rule: "non_plated 非金属孔"
  applies_to: non_plated
  source_page: 114
  quote: "2.non_plated(非金属孔)"

- id: drill.attribute.via
  rule: "ViA 只是导通作用的金属孔"
  applies_to: via
  source_page: 114
  quote: "3.ViA(只是导通作用的金属孔）"

- id: drill.attribute.how_to_define
  rule: "定义via孔：选择孔，选择VIA，点击ADD添加，Attributes显示红色，点击OK；定义非金属孔步骤一样"
  source_page: 114
  quote: "例如：定义via孔，先把需要定义孔属性的选择起来，然后选择VIA,点击ADD添加，Attributes显示红色，点击OK就定义好了，定义非金属孔步骤也一样的"

- id: drill.attribute.confirm_with_customer
  rule: "定义孔属性一定要看客户要求结合资料设计，有问题需要提出来与客户确认"
  source_page: 114
  quote: "注意：定义孔属性一定要看客户要求结合资料设计，有问题需要提出来与客户确认。"

# ---- 二、孔径预大 (p114) ----
- id: drill.oversize.plated
  rule: "Plated 孔一般预大 0.15MM"
  value: 0.15
  unit: mm
  applies_to: plated
  source_page: 114
  quote: "一般plated预大0.15MM"

- id: drill.oversize.non_plated
  rule: "non_plated 孔一般预大 0.05MM"
  value: 0.05
  unit: mm
  applies_to: non_plated
  source_page: 114
  quote: "non_plated一般预大0.05MM"

- id: drill.oversize.via
  rule: "VIA 孔一般不做预大"
  value: 0
  unit: mm
  applies_to: via
  source_page: 114
  quote: "VIA孔一般不做预大"

# ---- 三、钻孔预大操作 (p115) ----
- id: drill.oversize.drill_tools_manager
  rule: "在 drl 层右键 drill tools manager，在实际钻嘴栏输入预大后的钻孔"
  source_page: 115
  quote: "右键选择红色箭头 “drill tools manager” 弹出窗口，在实际钻嘴栏输入预大后的钻孔"

# ---- 四、钻孔检查 Analysis > Drill Checks (p116) ----
- id: drill.check.hole_size
  rule: "Hole Size 列出各种孔(NPTH、PTH、Via),包括导引孔（pilot drill）"
  source_page: 116
  quote: "Hole Size        列出各种孔(NPTH、PTH、Via"
  note: "原文续为 \"),包括导引孔（pilot drill）\"，中间被图注 \"离\" 字隔开"

- id: drill.check.extra_holes
  rule: "Extra Holes 报告不属于任何Pad的多余孔"
  source_page: 116
  quote: "Extra Holes      报告不属于任何Pad的多余孔"

- id: drill.check.hole_separation
  rule: "Hole Separtion 报告重复孔、接触孔和闭合孔(close hole)"
  source_page: 116
  quote: "Hole Separtion    报告重复孔、接触孔和闭合孔(close hole)"

- id: drill.check.power_ground_shorts
  rule: "Power/Ground Shorts 报告与地电层短路的钻孔"
  source_page: 116
  quote: "Power/Ground Shorts 报告与地电层短路的钻孔"

- id: drill.check.missing_holes
  rule: "Missing holes 非SMD Pads的缺孔"
  source_page: 116
  quote: "Missing holes     非SMD Pads的缺孔"

- id: drill.check.npth_to_rout
  rule: "NPTH to Rout 报告具有.Tooling_hole，.mount_hole属性的钻孔和靠近成型线的NTPH"
  source_page: 116
  quote: "NPTH to Rout     报告具有.Tooling_hole，.mount_hole属性的钻孔和靠近成型线的NTPH"

# ---- 常见报告结果 (p116–117) ----
- id: drill.check.result.duplicate_holes
  rule: "Duplicate Holes (Hole Separation)：重叠的孔（比如，同心圆）"
  source_page: 116
  quote: "1）、Duplicate Holes (Hole Separation)   重叠的孔（比如，同心圆）"

- id: drill.check.result.touching_holes
  rule: "Touching Holes (Hole Separation)：彼此接触的孔"
  source_page: 117
  quote: "2）、Touching Holes (Hole Separation)      彼此接触的孔"

- id: drill.check.result.close_holes
  rule: "Close Holes (Hole Separation)：太靠近的孔"
  source_page: 117
  quote: "3）、Close Holes (Hole Separation)      太靠近的孔"

- id: drill.check.result.missing_holes
  rule: "Missing Holes (Missing Holes)：缺孔"
  source_page: 117
  quote: "4）、Missing Holes (Missing Holes):   缺孔"

- id: drill.check.result.extra_holes
  rule: "Extra Holes (Extra Holes)：多孔"
  source_page: 117
  quote: "5）、Extra Holes (Extra Holes):       多孔"

- id: drill.check.result.npth_to_rout
  rule: "NPTH to Rout (NPTH to Rout)：非金属孔距板边距离"
  source_page: 117
  quote: "6）、NPTH to Rout (NPTH to Rout) 非金属孔距板边距离"

# ---- 五、钻孔输出 (p118) ----
- id: drill.output.after_panel
  rule: "等资料做好，拼好整个生产panel，才输出钻孔（Engineering Toolkit → Actions → Auto Drill Manager）"
  source_page: 118
  quote: "等资料做好，拼好整个生产panel，就可以输出钻孔，切换到Engineering Toolkit窗口，ActionsAuto Drill Manager"

- id: drill.output.script
  rule: "现在工厂一般都是用脚本输出钻孔"
  source_page: 118
  quote: "（现在工厂一般都是用脚本输出）"

# ---- 六、注意事项 (p118) ----
- id: drill.note.check_missing_holes_slots
  rule: "检查是否有漏孔漏槽，与原稿分孔图对，多次看客户制作要求"
  source_page: 118
  quote: "1）检查是否有漏孔漏槽与原稿分孔图对，多次看看客户制作要求；"

- id: drill.note.short_slot
  rule: "注意短槽的制作，每一个工厂要求不一样"
  source_page: 118
  quote: "2）注意短槽的制作（每一个工厂不同要求不一样）；"
  factory_specific: true

- id: drill.note.close_and_intersecting_holes
  rule: "近孔及相交孔制作要求根据工厂不同要求不同"
  source_page: 118
  quote: "3）近孔及相交孔制作要求（根据工厂不同要求不同）；"
  factory_specific: true

- id: drill.note.chamfer_holes
  rule: "注意倒角孔的加法"
  source_page: 118
  quote: "4）注意倒角孔的加法；"

- id: drill.note.deburr_holes
  rule: "除披峰及毛刺孔的加法"
  source_page: 118
  quote: "5）除披峰及毛刺孔的加法."
