[project]
name = "pcb-worker"
version = "0.1.0"
description = "PCB CAM worker: Gerber/Excellon ingestion, DFM checks, StageReport API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gerbonara",
    "shapely>=2.1",
    "pydantic>=2",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "numpy",
    "py7zr>=1.1.3",
    "rarfile>=4.5",
    "olefile>=0.47",
    "fonttools>=4.65.0",
    "hershey-fonts>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pygerber>=3.0.0a4",
    "httpx",
    "pymupdf>=1.28.2",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
prerelease = "allow"
